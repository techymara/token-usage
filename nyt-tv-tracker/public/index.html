<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYT TV Tracker</title>
<meta name="description" content="How many of The New York Times' 100 Best TV Shows of the 21st Century have you seen?">
<meta property="og:title" content="How many of the NYT's 100 best TV shows have you seen?">
<meta property="og:description" content="Check off what you've seen, mark what you want to watch, and share your score.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f5;
    --text: #121212;
    --muted: #5a5a5a;
    --rule: #121212;
    --hair: #e2e2e2;
    --accent: #326891;
    --seen: #121212;
    --want: #b8860b;
    --focus: #326891;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --surface: #1c1c1c; --text: #f0f0ee; --muted: #a3a3a3;
      --rule: #f0f0ee; --hair: #2e2e2e; --accent: #7fb2d9; --seen: #f0f0ee; --want: #e0b54a; --focus: #7fb2d9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --surface: #1c1c1c; --text: #f0f0ee; --muted: #a3a3a3;
    --rule: #f0f0ee; --hair: #2e2e2e; --accent: #7fb2d9; --seen: #f0f0ee; --want: #e0b54a; --focus: #7fb2d9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Libre Franklin", system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.4;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }

  header { border-bottom: 2px solid var(--rule); padding-bottom: 16px; }
  .kicker { font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 500; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; margin: 0; }
  h1 sup { font-size: .5em; }

  .banner {
    margin-top: 20px; padding: 12px 14px; background: var(--surface); border-left: 3px solid var(--accent);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  }
  .banner p { margin: 0; }

  .score { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0 8px; }
  .stat { background: var(--surface); padding: 12px 14px; }
  .stat .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .stat .value { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 15px; font-weight: 600; color: var(--muted); }
  .bar { height: 6px; background: var(--hair); margin-top: 8px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--seen); transition: width .25s ease; }
  .bar.want > span { background: var(--want); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  button, .btn {
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none;
    padding: 9px 14px; border: 1px solid var(--text); background: var(--bg); color: var(--text);
    display: inline-flex; align-items: center; gap: 6px; border-radius: 2px;
  }
  button.primary, .btn.primary { background: var(--text); color: var(--bg); }
  button:hover, .btn:hover { opacity: .85; }
  button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.ghost { border-color: var(--hair); color: var(--muted); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: 10px 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; }
  .filters button { border-color: transparent; padding: 6px 10px; font-size: 13px; }
  .filters button[aria-pressed="true"] { border-color: var(--text); }
  .search { flex: 1 1 180px; min-width: 0; }
  .search input {
    width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--hair); background: var(--bg); color: var(--text); border-radius: 2px;
  }

  .colhead, .row { display: grid; grid-template-columns: 36px 1fr 56px 56px; align-items: center; gap: 8px; }
  .colhead { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 12px 0 6px; border-bottom: 1px solid var(--rule); }
  .colhead span:nth-child(n+3) { text-align: center; }
  .lists { display: grid; grid-template-columns: 1fr; column-gap: 40px; }
  @media (min-width: 860px) { .lists { grid-template-columns: 1fr 1fr; } }
  .list { list-style: none; margin: 0; padding: 0; }
  .row { padding: 7px 0; border-bottom: 1px solid var(--hair); }
  .row .rank { font-weight: 700; font-variant-numeric: tabular-nums; }
  .row .title b { font-weight: 700; }
  .row .title .yrs { color: var(--muted); white-space: nowrap; }
  .row.is-seen .title b { text-decoration: line-through; text-decoration-thickness: 1px; }
  .cell { display: flex; justify-content: center; }
  .cell input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border: 1.5px solid var(--muted); border-radius: 2px; cursor: pointer; display: grid; place-content: center; background: var(--bg); }
  .cell input::after { content: ""; width: 12px; height: 7px; border-left: 2.5px solid var(--bg); border-bottom: 2.5px solid var(--bg); transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
  .cell input:checked::after { opacity: 1; }
  .cell input.seen:checked { background: var(--seen); border-color: var(--seen); }
  .cell input.want:checked { background: var(--want); border-color: var(--want); }
  .cell input:disabled { cursor: default; }
  .empty { color: var(--muted); padding: 24px 0; }
  .hidden { display: none !important; }

  footer { margin-top: 28px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--hair); padding-top: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  footer a { color: var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--text); color: var(--bg); padding: 10px 16px; font-weight: 600; font-size: 14px; border-radius: 2px;
    transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .colhead, .row { grid-template-columns: 30px 1fr 44px 44px; gap: 6px; }
    .stat .value { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">The New York Times list · Interactive checklist</p>
    <h1>The 100 Best TV Shows of the 21<sup>st</sup> Century</h1>
  </header>

  <div id="sharedBanner" class="banner hidden" role="status">
    <p id="sharedText"></p>
    <button id="startOwn" class="primary">Start my own list</button>
  </div>

  <section class="score" aria-label="Your score">
    <div class="stat">
      <div class="label" id="seenLabel">You've seen</div>
      <div class="value"><span id="seenCount">0</span><small>/100</small></div>
      <div class="bar"><span id="seenBar"></span></div>
    </div>
    <div class="stat">
      <div class="label">Want to see</div>
      <div class="value"><span id="wantCount">0</span></div>
      <div class="bar want"><span id="wantBar"></span></div>
    </div>
    <div class="stat">
      <div class="label">Verdict</div>
      <div class="value" style="font-size:18px;padding-top:8px" id="verdict">Just getting started</div>
    </div>
  </section>

  <div class="actions" id="actions">
    <a class="btn primary" id="tweetBtn" href="#" target="_blank" rel="noopener">Share on X</a>
    <button id="copyLinkBtn">Copy share link</button>
    <button id="copyListBtn">Copy my list</button>
    <button id="resetBtn" class="ghost">Reset</button>
  </div>

  <div class="toolbar">
    <div class="filters" role="group" aria-label="Filter">
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="seen" aria-pressed="false">Seen</button>
      <button data-filter="unseen" aria-pressed="false">Not seen</button>
      <button data-filter="want" aria-pressed="false">Want to see</button>
    </div>
    <label class="search"><span class="hidden">Search shows</span>
      <input id="search" type="search" placeholder="Search shows…" autocomplete="off">
    </label>
  </div>

  <div class="lists" id="lists"></div>
  <p id="empty" class="empty hidden">No shows match.</p>

  <footer>
    <span>List from <a href="https://www.nytimes.com/bestTV" target="_blank" rel="noopener">nytimes.com/bestTV</a>. Your checks are saved in this browser.</span>
    <span>Not affiliated with The New York Times.</span>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SHOWS = [
  ["Breaking Bad","2008-2013"],["The Wire","2002-2008"],["Mad Men","2007-2015"],["Succession","2018-2023"],
  ["Fleabag","2016-2019"],["Game of Thrones","2011-2019"],["Veep","2012-2019"],["30 Rock","2006-2013"],
  ["Curb Your Enthusiasm","2000-2024"],["Atlanta","2016-2022"],["The Office (U.S.)","2005-2013"],
  ["Arrested Development","2003-2019"],["Girls","2012-2017"],["Friday Night Lights","2006-2011"],
  ["Six Feet Under","2001-2005"],["The Office (U.K.)","2001-2003"],["The Americans","2013-2018"],
  ["I May Destroy You","2020"],["Chernobyl","2019"],["The Crown","2016-2023"],["The White Lotus","2021-present"],
  ["Lost","2004-2010"],["The Comeback","2005-2026"],["Deadwood","2004-2006"],["The Leftovers","2014-2017"],
  ["Black Mirror","2011-present"],["Better Call Saul","2015-2022"],["Band of Brothers","2001"],
  ["Key & Peele","2012-2015"],["Severance","2022-present"],["Survivor","2000-present"],["Andor","2022-2025"],
  ["Enlightened","2011-2013"],["Schitt's Creek","2015-2020"],["True Detective (Season 1)","2014"],
  ["The Pitt","2025-present"],["Battlestar Galactica","2005-2009"],["Homeland","2011-2020"],["Watchmen","2019"],
  ["Adolescence","2025"],["Louie","2010-2015"],["Hacks","2021-2026"],["Peaky Blinders","2013-2022"],
  ["BoJack Horseman","2014-2020"],["Happy Valley","2014-2023"],["Broad City","2014-2019"],
  ["Twin Peaks: The Return","2017"],["House of Cards","2013-2018"],["Normal People","2020"],
  ["Parks and Recreation","2009-2015"],["The Good Place","2016-2020"],["Downton Abbey","2010-2015"],
  ["Stranger Things","2016-2025"],["The Bureau","2015-2020"],["Insecure","2016-2021"],["Nathan for You","2013-2017"],
  ["I Think You Should Leave","2019-present"],["Chappelle's Show","2003-2006"],["PEN15","2019-2021"],
  ["Peep Show","2003-2015"],["RuPaul's Drag Race","2009-present"],["Slow Horses","2022-present"],
  ["The Thick of It","2005-2012"],["Anthony Bourdain: Parts Unknown","2013-2018"],["Mare of Easttown","2021"],
  ["The Rehearsal","2022-present"],["The Handmaid's Tale","2017-2025"],["Ozark","2017-2022"],
  ["Anthony Bourdain: No Reservations","2005-2012"],["The Shield","2002-2008"],["Beef (Season 1)","2023"],
  ["Squid Game","2021-2025"],["Barry","2018-2023"],["The Bear","2022-2026"],["Ted Lasso","2020-present"],
  ["Somebody Somewhere","2022-2024"],["Modern Family","2009-2020"],["It's Always Sunny in Philadelphia","2005-present"],
  ["The Good Wife","2009-2016"],["How To With John Wilson","2020-2023"],["The Queen's Gambit","2020"],
  ["Better Things","2016-2022"],["Justified","2010-2015"],["Planet Earth","2006"],
  ["The Great British Baking Show","2010-present"],["Shogun","2024-present"],["Reservation Dogs","2021-2023"],
  ["Dexter","2006-2013"],["Baby Reindeer","2024"],["Eastbound & Down","2009-2013"],["Catastrophe","2015-2019"],
  ["The Night Of","2016"],["Station Eleven","2021-2022"],["The Diplomat","2023-present"],["House","2004-2012"],
  ["Halt and Catch Fire","2014-2017"],["Community","2009-2015"],["The OA","2016-2019"],
  ["Gilmore Girls","2000-2007"],["Scandal","2012-2018"]
];
const N = SHOWS.length;
const STORE_KEY = "nyt-tv-tracker:v1";

// ---- state ------------------------------------------------------------
let mine = load();
let shared = parseHash();           // a friend's list opened from a share link (read-only)
let filter = "all";
let query = "";

function blank() { return { seen: new Array(N).fill(false), want: new Array(N).fill(false) }; }
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (raw && Array.isArray(raw.seen) && raw.seen.length === N) return raw;
  } catch (e) {}
  return blank();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(mine)); } catch (e) {} }
function current() { return shared || mine; }

// ---- compact share encoding: 100 booleans -> 13 bytes -> base64url ------
function encode(bits) {
  const bytes = new Uint8Array(Math.ceil(N / 8));
  bits.forEach((b, i) => { if (b) bytes[i >> 3] |= 1 << (i & 7); });
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decode(str) {
  try {
    const bin = atob(str.replace(/-/g, "+").replace(/_/g, "/"));
    return Array.from({ length: N }, (_, i) => !!((bin.charCodeAt(i >> 3) || 0) & (1 << (i & 7))));
  } catch (e) { return null; }
}
function parseHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.has("s")) return null;
  const seen = decode(p.get("s") || "");
  const want = decode(p.get("w") || "") || new Array(N).fill(false);
  return seen ? { seen, want } : null;
}
function shareUrl() {
  const base = location.href.split("#")[0];
  return `${base}#s=${encode(mine.seen)}&w=${encode(mine.want)}`;
}

// ---- rendering --------------------------------------------------------
const lists = document.getElementById("lists");
function buildRows() {
  const half = Math.ceil(N / 2);
  [SHOWS.slice(0, half), SHOWS.slice(half)].forEach((chunk, c) => {
    const col = document.createElement("div");
    col.innerHTML = `<div class="colhead"><span>#</span><span>Show</span><span>I've seen it</span><span>Want to see</span></div>`;
    const ul = document.createElement("ul");
    ul.className = "list";
    chunk.forEach(([name, yrs], j) => {
      const i = c * half + j;
      const li = document.createElement("li");
      li.className = "row";
      li.dataset.i = i;
      li.dataset.name = name.toLowerCase();
      li.innerHTML = `
        <span class="rank">${i + 1}.</span>
        <span class="title"><b></b> <span class="yrs">(${yrs})</span></span>
        <span class="cell"><input type="checkbox" class="seen" data-kind="seen" aria-label="I've seen ${name.replace(/"/g, "&quot;")}"></span>
        <span class="cell"><input type="checkbox" class="want" data-kind="want" aria-label="I want to see ${name.replace(/"/g, "&quot;")}"></span>`;
      li.querySelector("b").textContent = name;
      ul.appendChild(li);
    });
    col.appendChild(ul);
    lists.appendChild(col);
  });
}

function verdictFor(n) {
  if (n === 0) return "Just getting started";
  if (n < 10) return "Casual viewer";
  if (n < 25) return "Couch regular";
  if (n < 50) return "Serious binger";
  if (n < 75) return "Prestige TV devotee";
  if (n < 100) return "Certified critic";
  return "You've seen it all 🏆";
}

function render() {
  const st = current();
  const seenN = st.seen.filter(Boolean).length;
  const wantN = st.want.filter(Boolean).length;
  let visible = 0;

  document.querySelectorAll(".row").forEach(li => {
    const i = +li.dataset.i;
    const s = li.querySelector("input.seen"), w = li.querySelector("input.want");
    s.checked = st.seen[i]; w.checked = st.want[i];
    s.disabled = w.disabled = !!shared;
    li.classList.toggle("is-seen", st.seen[i]);
    const matchFilter = filter === "all" || (filter === "seen" && st.seen[i]) ||
      (filter === "unseen" && !st.seen[i]) || (filter === "want" && st.want[i]);
    const show = matchFilter && (!query || li.dataset.name.includes(query));
    li.classList.toggle("hidden", !show);
    if (show) visible++;
  });

  document.getElementById("seenCount").textContent = seenN;
  document.getElementById("wantCount").textContent = wantN;
  document.getElementById("seenBar").style.width = seenN + "%";
  document.getElementById("wantBar").style.width = wantN + "%";
  document.getElementById("verdict").textContent = verdictFor(seenN);
  document.getElementById("empty").classList.toggle("hidden", visible > 0);
  document.getElementById("seenLabel").textContent = shared ? "They've seen" : "You've seen";

  document.getElementById("sharedBanner").classList.toggle("hidden", !shared);
  document.getElementById("actions").classList.toggle("hidden", !!shared);
  if (shared) {
    const mySeen = mine.seen.filter(Boolean).length;
    const both = shared.seen.filter((b, i) => b && mine.seen[i]).length;
    document.getElementById("sharedText").textContent = mySeen
      ? `You're viewing a friend's list: ${seenN}/100 seen. You've both seen ${both}. (You're at ${mySeen}/100.)`
      : `You're viewing a friend's list: they've seen ${seenN}/100. How many have you seen?`;
  } else {
    document.getElementById("tweetBtn").href = "https://twitter.com/intent/tweet?" + new URLSearchParams({
      text: `I've watched ${seenN} out of 100 of the NYT's best TV shows of the 21st century 📺`,
      url: shareUrl(),
    });
  }
}

// ---- events -----------------------------------------------------------
lists.addEventListener("change", e => {
  const t = e.target;
  if (shared || !t.dataset.kind) return;
  const i = +t.closest(".row").dataset.i;
  mine[t.dataset.kind][i] = t.checked;
  if (t.dataset.kind === "seen" && t.checked) mine.want[i] = false; // seen it -> no longer on the want list
  save();
  render();
});

document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  filter = b.dataset.filter;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

document.getElementById("startOwn").addEventListener("click", () => {
  shared = null;
  history.replaceState(null, "", location.pathname + location.search);
  render();
});

document.getElementById("copyLinkBtn").addEventListener("click", () => copy(shareUrl(), "Share link copied"));
document.getElementById("copyListBtn").addEventListener("click", () => {
  const seenN = mine.seen.filter(Boolean).length;
  const lines = [`I've watched ${seenN}/100 of the NYT's 100 Best TV Shows of the 21st Century 📺`, ""];
  SHOWS.forEach(([name], i) => { if (mine.seen[i]) lines.push(`✅ ${i + 1}. ${name}`); });
  const wants = SHOWS.map(([name], i) => mine.want[i] ? `👀 ${i + 1}. ${name}` : null).filter(Boolean);
  if (wants.length) lines.push("", "Want to see:", ...wants);
  lines.push("", shareUrl());
  copy(lines.join("\n"), "List copied to clipboard");
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Clear all your checkmarks?")) return;
  mine = blank(); save(); render();
});
window.addEventListener("hashchange", () => { shared = parseHash(); render(); });

async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  toast(msg);
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

buildRows();
render();
</script>
</body>
</html>
